<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Orrery: a raid for whoever is at the table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-link" href="/readme/">About this raid</a>
    </header>

    <!-- Inside #battle the game's rules apply (CLAUDE.md, "Design: the battle screen"). -->
    <main id="battle" data-phase="join" aria-labelledby="battle-title">
      <div class="battle-bar">
        <h1 id="battle-title" class="battle-title">The Orrery</h1>
        <p class="battle-link" data-link>Connecting</p>
        <button type="button" class="mute" data-mute aria-pressed="false">Sound</button>
      </div>

      <section class="stage" data-stage aria-label="The battle">
        <div class="scene" data-scene></div>
        <aside class="strip" data-rail aria-label="Turn order"></aside>
        <section class="command window" data-command aria-label="Your commands"></section>
        <section class="log-window window" aria-label="What happened">
          <ol class="log" data-log role="log"></ol>
        </section>
      </section>

      <section class="join" data-join-screen aria-label="Join the raid"></section>

      <p class="visually-hidden" data-announce aria-live="polite"></p>
    </main>
  </body>
</html>
